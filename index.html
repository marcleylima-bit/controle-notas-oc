<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Notas OC</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  color-scheme: dark;
  --bg:#071426;
  --panel:#0d2038;
  --border:#24405f;
  --text:#e8f0ff;
  --muted:#a8b8ce;
  --blue:#5ba7ff;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,Arial,sans-serif;
}
header {
  background:var(--panel);
  border-bottom:1px solid var(--border);
  padding:24px;
}
header,main { max-width:1250px; margin:auto; }
h1 { margin:0; font-size:30px; }
header p,.muted { color:var(--muted); }
main { padding:20px; }
.panel {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:20px;
  margin-bottom:18px;
}
h2 { margin-top:0; font-size:19px; }
.form {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  align-items:end;
}
label {
  display:block;
  margin-bottom:7px;
  font-size:13px;
  font-weight:700;
}
input,select,button {
  width:100%;
  padding:11px;
  border-radius:8px;
  font:inherit;
}
input,select {
  background:#08182a;
  color:var(--text);
  border:1px solid #355271;
}
button {
  background:var(--blue);
  color:#071426;
  font-weight:750;
  border:0;
  cursor:pointer;
}
button:disabled { opacity:.55; cursor:wait; }
.secondary { background:#24405f; color:white; }
.stats {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
  margin-bottom:18px;
}
.stat {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
}
.stat span { display:block; color:var(--muted); font-size:13px; }
.stat strong { font-size:27px; }
.toolbar {
  display:flex;
  gap:10px;
  margin:14px 0;
}
.toolbar input { flex:1; min-width:100px; }
.toolbar select { width:auto; min-width:150px; }
.toolbar button { width:auto; white-space:nowrap; }
.table-wrap {
  overflow-x:auto;
  border:1px solid var(--border);
  border-radius:9px;
}
table {
  border-collapse:collapse;
  width:100%;
  min-width:760px;
}
th,td {
  text-align:left;
  padding:12px;
  border-bottom:1px solid var(--border);
  font-size:13px;
}
th { background:#102844; }
tr:last-child td { border-bottom:0; }
.status { min-width:140px; padding:7px; }
.message {
  display:none;
  margin-top:12px;
  padding:11px;
  border-radius:8px;
  overflow-wrap:anywhere;
}
.message.ok { display:block; background:#123b37; color:#a9ffe4; }
.message.error { display:block; background:#49242c; color:#ffd4d9; }
.empty { text-align:center; padding:25px; color:var(--muted); }
.note { font-size:12px; color:var(--muted); }
@media(max-width:800px) {
  .form { grid-template-columns:1fr; }
  .toolbar { flex-wrap:wrap; }
  .toolbar input,.toolbar select,.toolbar button { width:100%; }
  .stats { gap:7px; }
  .stat { padding:10px; }
  .stat strong { font-size:22px; }
  main { padding:12px; }
  .panel { padding:14px; }
  header { padding:20px 14px; }
  h1 { font-size:25px; }
}
</style>
</head>
<body>

<header>
  <h1>Controle de Notas OC</h1>
  <p>Cadastro e acompanhamento das notas da equipe.</p>
</header>

<main>
  <section class="panel">
    <h2>Cadastrar nota OC</h2>
    <form id="form" class="form">
      <div>
        <label for="numero">Número da nota OC</label>
        <input id="numero" maxlength="80"
          placeholder="Ex.: OC-123456" required>
      </div>
      <div>
        <label for="data">Data de criação</label>
        <input id="data" type="date" required>
      </div>
      <div>
        <label for="atendente">Atendente</label>
        <select id="atendente" required>
          <option value="">Selecione o atendente</option>
        </select>
      </div>
      <div>
        <button id="salvar" type="submit">Cadastrar nota</button>
      </div>
    </form>
    <div id="msgForm" class="message"></div>
    <p class="note">Toda nota nova começa com o status Pendente.</p>
  </section>
<section class="stats">
    <div class="stat"><span>Total de notas</span><strong id="total">0</strong></div>
    <div class="stat"><span>Pendentes</span><strong id="pendentes">0</strong></div>
    <div class="stat"><span>Concluídas</span><strong id="concluidas">0</strong></div>
  </section>

  <section class="panel">
    <h2>Acompanhamento</h2>
    <div class="toolbar">
      <input id="busca" placeholder="Buscar nota ou atendente...">
      <select id="filtro">
        <option value="">Todos os status</option>
        <option>Pendente</option>
        <option>Em andamento</option>
        <option>Concluída</option>
      </select>
      <button id="atualizar" class="secondary" type="button">Atualizar</button>
      <button id="exportar" type="button">Gerar planilha</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Número OC</th>
            <th>Data de criação</th>
            <th>Adicionado por</th>
            <th>Cadastro</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="linhas">
          <tr><td colspan="5" class="empty">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
    <div id="msgLista" class="message"></div>
  </section>
</main>

<script>
const SUPABASE_URL =https://moxgiiwmvhaoaoplymai.supabase.co";
const SUPABASE_KEY = sb_publishable_p5msWrNrq4pLPGc2Xfs2QQ_i9MV_8-m;

const NOMES = [
  "ANDRESSA DA SILVA PAIVA",
  "DANIELE DA COSTA CHAGAS",
  "ERICA DA SILVA GOMES",
  "KARINY FERNANDA SOUSA DOS SANTOS",
  "MARIA VALQUIRIA MAIA SOARES",
  "WELLINGTON BRUNO DE SOUSA RODRIGUES",
  "ALINE DE LIMA CAVALCANTE",
  "PALOMA CLISIA BRAGA DE ALMEIDA",
  "RIAN CARLOS OLIVEIRA DA SILVA",
  "WELLYNGTON MARCLEY DE OLIVEIRA LIMA"
];

const STATUS = ["Pendente", "Em andamento", "Concluída"];
let db = null;
let notas = [];

const $ = id => document.getElementById(id);

function escapar(valor) {
  return String(valor ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[c]);
}

function mostrar(id, texto, tipo) {
  $(id).textContent = texto;
  $(id).className = "message " + tipo;
}

function dataBR(valor) {
  if (!valor) return "—";
  const p = valor.split("-");
  return p.length === 3 ? ${p[2]}/${p[1]}/${p[0]} : valor;
}

function inicializar() {
  $("atendente").innerHTML =
    '<option value="">Selecione o atendente</option>' +
    NOMES.map(n => <option value="${escapar(n)}">${escapar(n)}</option>).join("");

  if (
    SUPABASE_URL.startsWith("https://") &&
    !SUPABASE_URL.includes("https://moxgiiwmvhaoaoplymai.supabase.co") &&
    SUPABASE_KEY &&
    !SUPABASE_KEY.includes("sb_publishable_p5msWrNrq4pLPGc2Xfs2QQ_i9MV_8-m") &&
    window.supabase
  ) {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    carregar();
  } else {
    mostrar("msgLista",
      "Configure SUPABASE_URL e SUPABASE_KEY no código antes de usar.",
      "error");
    $("linhas").innerHTML =
      '<tr><td colspan="5" class="empty">Aguardando configuração.</td></tr>';
  }
}

async function carregar() {
  $("atualizar").disabled = true;
  try {
    const { data, error } = await db
      .from("notas_oc")
      .select("*")
      .order("created_at", { ascending:false });

    if (error) throw error;
    notas = data || [];
    renderizar();
  } catch (e) {
    mostrar("msgLista", "Erro ao carregar: " + e.message, "error");
  } finally {
    $("atualizar").disabled = false;
  }
}

function renderizar() {
  $("total").textContent = notas.length;
  $("pendentes").textContent =
    notas.filter(n => n.status === "Pendente").length;
  $("concluidas").textContent =
    notas.filter(n => n.status === "Concluída").length;

  const termo = $("busca").value.trim().toLocaleLowerCase("pt-BR");
  const filtro = $("filtro").value;

  const lista = notas.filter(n =>
    (!filtro || n.status === filtro) &&
    (
      String(n.numero).toLocaleLowerCase("pt-BR").includes(termo) ||
      String(n.atendente).toLocaleLowerCase("pt-BR").includes(termo)
    )
  );
if (!lista.length) {
    $("linhas").innerHTML =
      '<tr><td colspan="5" class="empty">Nenhuma nota encontrada.</td></tr>';
    return;
  }

  $("linhas").innerHTML = lista.map(n => {
    const cadastro = n.created_at
      ? new Date(n.created_at).toLocaleString("pt-BR")
      : "—";

    return 
      <tr>
        <td><strong>${escapar(n.numero)}</strong></td>
        <td>${escapar(dataBR(n.data_criacao))}</td>
        <td>${escapar(n.atendente)}</td>
        <td>${escapar(cadastro)}</td>
        <td>
          <select class="status" data-id="${escapar(n.id)}"
            aria-label="Status da nota ${escapar(n.numero)}">
            ${STATUS.map(s =>
              <option value="${s}" ${n.status === s ? "selected" : ""}>${s}</option>
            ).join("")}
          </select>
        </td>
      </tr>;
  }).join("");
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  if (!db) return;

  const botao = $("salvar");
  botao.disabled = true;
  botao.textContent = "Salvando...";

  try {
    const payload = {
      numero: $("numero").value.trim(),
      data_criacao: $("data").value,
      atendente: $("atendente").value,
      status: "Pendente"
    };

    if (!payload.numero  !payload.data_criacao  !payload.atendente) {
      throw new Error("Preencha todos os campos.");
    }

    if (!NOMES.includes(payload.atendente)) {
      throw new Error("Selecione um atendente válido.");
    }

    const { error } = await db.from("notas_oc").insert(payload);
    if (error) throw error;

    $("form").reset();
    mostrar("msgForm", "Nota OC cadastrada com sucesso!", "ok");
    await carregar();
  } catch (e) {
    mostrar("msgForm", "Não foi possível cadastrar: " + e.message, "error");
  } finally {
    botao.disabled = false;
    botao.textContent = "Cadastrar nota";
  }
});

$("linhas").addEventListener("change", async e => {
  const id = e.target.dataset.id;
  if (!id || !db) return;

  const status = e.target.value;
  e.target.disabled = true;

  try {
    const { error } = await db.from("notas_oc")
      .update({ status, updated_at:new Date().toISOString() })
      .eq("id", id);

    if (error) throw error;
    mostrar("msgLista", "Status atualizado!", "ok");
    await carregar();
  } catch (e) {
    mostrar("msgLista", "Não foi possível atualizar: " + e.message, "error");
    await carregar();
  }
});

$("busca").addEventListener("input", renderizar);
$("filtro").addEventListener("change", renderizar);
$("atualizar").addEventListener("click", carregar);

$("exportar").addEventListener("click", () => {
  const cabecalho = [
    "Número OC", "Data de criação", "Atendente",
    "Data do cadastro", "Status"
  ];

  const linhasCSV = notas.map(n => [
    n.numero,
    dataBR(n.data_criacao),
    n.atendente,
    n.created_at ? new Date(n.created_at).toLocaleString("pt-BR") : "",
    n.status
  ]);

  const csv = [cabecalho, ...linhasCSV].map(linha =>
    linha.map(v => "${String(v ?? "").replace(/"/g,'""')}").join(";")
  ).join("\r\n");

  const blob = new Blob(["\uFEFF" + csv], {
    type:"text/csv;charset=utf-8;"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "Controle_de_Notas_OC.csv";
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

inicializar();
</script>
</body>
</html>
